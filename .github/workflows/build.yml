name: Build OpenWrt Package

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'index.html'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OpenWrt Package (${{ matrix.openwrt_version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt_version: "24.10.6"
            sdk_url: "https://downloads.openwrt.org/releases/24.10.6/targets/x86/64/openwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            pkg_ext: "ipk"
          - openwrt_version: "25.12.4"
            sdk_url: "https://downloads.openwrt.org/releases/25.12.4/targets/x86/64/openwrt-sdk-25.12.4-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
            pkg_ext: "apk"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: openwrt-sdk-${{ matrix.openwrt_version }}-x86-64-${{ runner.os }}

      - name: Prepare OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          # 安装编译所需的依赖
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 python3-setuptools python3-distutils zstd
          
          # 下载 OpenWrt SDK
          wget "${{ matrix.sdk_url }}" -O sdk-archive
          
          # 创建 sdk 目录并解压
          mkdir sdk
          tar -xf sdk-archive --strip-components=1 -C sdk
          rm sdk-archive

      - name: Install Dependencies (if cache hit)
        if: steps.cache-sdk.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 python3-setuptools python3-distutils zstd

      - name: Prepare Package
        run: |
          # 将当前源码复制到 SDK 的 package 目录下
          mkdir -p sdk/package/luci-app-feiyoung
          rsync -av --exclude='sdk' --exclude='.git' --exclude='.github' . sdk/package/luci-app-feiyoung/

      - name: Compile
        run: |
          cd sdk
          # 清理缓存的 feeds 目录，防止 git pull 在 detached HEAD 状态下失败
          rm -rf feeds
          # 更新 feeds 以获取依赖 (luci, curl 等)
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a || true
          
          # 生成默认配置
          make defconfig
          
          # 编译我们的包
          make package/luci-app-feiyoung/compile V=s IGNORE_ERRORS=1

      - name: Organize Files
        id: organize
        run: |
          PKG_FILE=$(find sdk/bin/packages -name "luci-app-feiyoung*.${{ matrix.pkg_ext }}" | head -1)
          if [ -z "$PKG_FILE" ]; then
            echo "::error::Package file (*.${{ matrix.pkg_ext }}) not found!"
            exit 1
          fi
          mv "$PKG_FILE" .
          PKG_NAME=$(basename "$PKG_FILE")
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-feiyoung-${{ matrix.pkg_ext }}
          path: luci-app-feiyoung*.${{ matrix.pkg_ext }}

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: luci-app-feiyoung*.${{ matrix.pkg_ext }}
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

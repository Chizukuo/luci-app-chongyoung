name: 💡 新功能建议 (Feature Request)
description: 为 luci-app-feiyoung 提出新的功能建议或改进构想
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎为湖北电信校园网自动认证提出新的功能构思！
        请注意：插件核心严格遵循**通用性与解耦原则**，专属于特定用户的个人联动脚本（如特定的第三方向导、QoS 自定义流控规则）推荐通过 `/etc/feiyoung.user` 实现。
  - type: textarea
    id: problem
    attributes:
      label: 现有痛点或需求背景 (Problem Statement)
      description: 当前遇到了什么不便？为什么需要这个新功能？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案 (Proposed Solution)
      description: 你希望这个功能如何实现？预期的工作逻辑是怎样的？
    validations:
      required: true
  - type: dropdown
    id: scope_assessment
    attributes:
      label: 架构通用性评估 (Scope Assessment)
      description: 该功能是否为广大湖北电信校园网用户的普遍需求？
      options:
        - "是，此功能具有普适性，建议纳入插件主线核心"
        - "可能偏小众，希望作为高级可选配置项"
        - "属于用户定制扩展，探讨在 /etc/feiyoung.user 中实现更佳"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或参考实现 (Alternatives)
      description: 是否有其他的替代解决方案或参考资料？
